<!DOCTYPE html>
<!-- Redesign pass based on unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>구조부 데일리 브리핑</title>
<script>
  /* 첫 화면 깜빡임 방지: 저장된 테마 또는 시스템 설정을 먼저 적용 */
  (function () {
    var t = null;
    try { t = localStorage.getItem('briefing-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  /* ───────── 토큰: 그라파이트 중립 램프 + 블루 강조 하나 ───────── */
  :root {
    --hh: 60px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Pretendard Variable", Pretendard, monospace;

    --bg: #fafafa;
    --panel: #ffffff;
    --raised: #f4f4f5;
    --raised-2: #ffffff;
    --ink: #171717;
    --sub: #525252;
    --mute: #6e6e6e;
    --ink-rgb: 23 23 23;
    --line: rgb(var(--ink-rgb) / 0.08);
    --line-2: rgb(var(--ink-rgb) / 0.14);

    --accent: #1f5f9e;
    --up: #c2413c;
    --down: #2d63b3;
    --warn: #a15c07;

    --bar-a: #d8d8db;
    --bar-b: #c6c6ca;
    --shadow-s: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-m: 0 8px 24px rgba(0, 0, 0, 0.06);
  }
  [data-theme="dark"] {
    --bg: #141415;
    --panel: #19191b;
    --raised: #232325;
    --raised-2: #2c2c2f;
    --ink: #ededed;
    --sub: #a1a1a6;
    --mute: #85858b;
    --ink-rgb: 237 237 237;

    --accent: #7db4ea;
    --up: #ff7b76;
    --down: #78a8ff;
    --warn: #e2ad5e;

    --bar-a: #3a3a3e;
    --bar-b: #2c2c2f;
    --shadow-s: none;
    --shadow-m: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light; scroll-padding-top: 124px; }
  html[data-theme="dark"] { color-scheme: dark; }
  body {
    font-family: var(--font);
    font-size: 14px;
    line-height: 20px;
    font-variant-numeric: tabular-nums;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .icw { display: inline-flex; color: var(--mute); }
  .n, .d, .mono { font-family: var(--mono); }

  /* ───────── 상단 바 ───────── */
  .top { position: sticky; top: 0; z-index: 40; height: var(--hh); background: var(--bg); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1440px; height: 100%; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { min-width: 0; }
  .brand h1 { font-size: 16px; line-height: 20px; font-weight: 500; white-space: nowrap; }
  .brand p { margin-top: 2px; font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--mute); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .ctl {
    height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px;
    font-size: 13px; line-height: 20px; white-space: nowrap; color: var(--ink); text-decoration: none;
    transition: background-color 140ms var(--ease), border-color 140ms var(--ease), transform 140ms var(--ease);
  }
  .ctl:hover { background: var(--raised); }
  .ctl:active { transform: scale(0.98); }
  .ctl[hidden] { display: none; }
  select.ctl { padding-right: 8px; cursor: pointer; }
  .ctl .rain { font-family: var(--mono); font-size: 12px; color: var(--down); }

  .wx { position: relative; }
  .wx-panel {
    position: absolute; right: 0; top: 44px; z-index: 50; width: 280px; padding: 8px;
    background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow-m);
    animation: pop 180ms var(--ease);
  }
  .wx-panel[hidden] { display: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .wx-cities { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .wx-c { height: 28px; padding: 0 8px; border-radius: 4px; font-size: 12px; color: var(--sub); transition: background-color 140ms var(--ease), color 140ms var(--ease); }
  .wx-c:hover { background: var(--raised); color: var(--ink); }
  .wx-c[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .wx-h { padding: 0 8px 4px; font-size: 12px; line-height: 16px; color: var(--mute); }
  .wx-r { display: grid; grid-template-columns: 40px 24px 1fr auto; align-items: center; height: 32px; padding: 0 8px; border-radius: 4px; font-size: 13px; }
  .wx-r.today { background: var(--raised); }
  .wx-r .dn { color: var(--sub); }
  .wx-r.today .dn { color: var(--ink); }
  .wx-r .tp, .wx-r .rn { font-family: var(--mono); font-size: 12px; }
  .wx-r .rn { min-width: 56px; text-align: right; color: var(--down); }

  /* ───────── 시장 지표 ───────── */
  .market { border-bottom: 1px solid var(--line); }
  .market[hidden] { display: none; }
  .market-in { max-width: 1440px; height: 40px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 32px; overflow-x: auto; scrollbar-width: none; }
  .market-in::-webkit-scrollbar { display: none; }
  .mk { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; font-size: 12px; line-height: 16px; }
  .mk-n { color: var(--mute); }
  .mk-v { font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .mk-c { font-family: var(--mono); }
  .mk-c.up { color: var(--up); }
  .mk-c.down { color: var(--down); }

  /* ───────── 휴가용 항공권·기차·버스 ───────── */
  .vac-card {
    width: 100%; display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; padding: 14px 16px;
    background: var(--panel); border: 1.5px solid var(--accent); border-radius: 12px;
    box-shadow: var(--shadow-s); text-align: left; color: var(--ink);
    transition: background-color 140ms var(--ease), border-color 140ms var(--ease), transform 140ms var(--ease), box-shadow 140ms var(--ease);
  }
  .vac-card:hover { background: var(--raised); transform: translateY(-1px); }
  .vac-card:active { transform: scale(0.99); }
  .vac-card .vac-ic {
    width: 40px; height: 40px; flex: none; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
  }
  .vac-card .vac-ic .ic { width: 20px; height: 20px; }
  .vac-card .vac-txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .vac-card .vac-title { font-size: 16px; line-height: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }
  .vac-card .vac-desc { font-size: 12px; line-height: 16px; color: var(--sub); }
  .vac-card[aria-pressed="true"] { background: var(--raised); box-shadow: inset 0 0 0 1px var(--accent); }
  .vac-sw { position: relative; width: 32px; height: 18px; border-radius: 999px; background: var(--line-2); transition: background-color 160ms var(--ease); flex: none; }
  .vac-sw::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--panel); transition: transform 160ms var(--ease);
  }
  .vac-card[aria-pressed="true"] .vac-sw { background: var(--accent); }
  .vac-card[aria-pressed="true"] .vac-sw::after { transform: translateX(14px); }

  .vac-bar { border-bottom: 1px solid var(--line); background: var(--panel); animation: pop 180ms var(--ease); }
  .vac-bar[hidden] { display: none; }
  .vac-in { max-width: 1440px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
  .vac-head { display: flex; align-items: center; gap: 10px; margin-right: 4px; }
  .vac-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; flex: 1 1 auto; }
  .vac-form[hidden] { display: none; }
  .vac-field { display: flex; flex-direction: column; gap: 4px; }
  .vac-field label { font-size: 11px; line-height: 14px; color: var(--mute); }
  .vac-input {
    height: 36px; padding: 0 10px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px;
    font-size: 13px; color: var(--ink); min-width: 120px; transition: border-color 140ms var(--ease);
  }
  .vac-input:focus { border-color: var(--accent); outline: none; }
  .vac-input[type="date"] { font-family: var(--mono); font-size: 12px; min-width: 136px; }
  .vac-swap { width: 36px; height: 36px; padding: 0; justify-content: center; flex: none; }
  .vac-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
  .vac-go { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .vac-go:hover { background: var(--accent); filter: brightness(1.08); }
  .vac-go .icw { color: #fff; }

  /* ───────── 문의사항 모달 ───────── */
  .req-backdrop {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
    background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(2px);
  }
  .req-backdrop[hidden] { display: none; }
  .req-modal {
    width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px;
    box-shadow: var(--shadow-m); overflow: hidden; animation: pop 180ms var(--ease);
  }
  .req-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .req-hd h2 { font-size: 15px; font-weight: 600; }
  .req-bd { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .req-to { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--raised); border-radius: 8px; font-size: 12px; color: var(--sub); }
  .req-copy { height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel); font-size: 11px; color: var(--ink); }
  .req-copy:hover { background: var(--bg); }
  .req-bd textarea { width: 100%; min-height: 110px; padding: 10px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; font: inherit; font-size: 13px; color: var(--ink); resize: vertical; }
  .req-bd textarea:focus { border-color: var(--accent); outline: none; }
  .req-status { font-size: 12px; line-height: 18px; min-height: 18px; color: var(--sub); }
  .req-status.ok { color: var(--accent); }
  .req-status.err { color: var(--up); }
  .req-ft { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--raised); }

  /* ───────── 레이아웃 ───────── */
  .shell { max-width: 1440px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 32px; }

  /* 내비게이션 */
  .side { position: sticky; top: var(--hh); align-self: start; max-height: calc(100vh - var(--hh)); overflow-y: auto; padding: 24px 0 32px; scrollbar-width: thin; }
  .nav-all, .nav-i {
    width: 100%; height: 32px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px;
    padding: 0 12px; border-radius: 8px; font-size: 14px; line-height: 20px; text-align: left; color: var(--sub);
    transition: background-color 140ms var(--ease), color 140ms var(--ease);
  }
  .nav-all { height: 36px; font-weight: 500; color: var(--ink); }
  .nav-i + .nav-i { margin-top: 2px; }
  .nav-all .nm, .nav-i .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-all .n, .nav-i .n { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--mute); text-align: right; }
  .nav-new { color: var(--accent); font-size: 11px; font-weight: 600; }
  .nav-all:hover, .nav-i:hover { background: var(--raised); color: var(--ink); }
  .nav-all[aria-current="true"], .nav-i[aria-current="true"] { background: var(--raised); color: var(--ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
  .nav-g { margin-top: 24px; }
  .nav-gt { margin-bottom: 8px; padding: 0 12px; font-size: 12px; line-height: 16px; color: var(--mute); }

  main { min-width: 0; padding: 24px 0 64px; }

  /* 도구줄 */
  .toolbar { position: sticky; top: var(--hh); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0; margin-bottom: 12px; background: var(--bg); }
  .search { position: relative; flex: 1 1 240px; max-width: 400px; }
  .search input { width: 100%; height: 36px; padding: 0 40px 0 36px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; font-size: 14px; transition: border-color 140ms var(--ease); }
  .search input::placeholder { color: var(--mute); }
  .search input:focus { border-color: var(--accent); }
  .search .icw { position: absolute; left: 12px; top: 10px; pointer-events: none; }
  .search kbd { position: absolute; right: 8px; top: 8px; height: 20px; min-width: 20px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: var(--mute); border: 1px solid var(--line-2); border-radius: 4px; pointer-events: none; }
  .search kbd[hidden] { display: none; }
  .search .clr { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; transition: background-color 140ms var(--ease); }
  .search .clr[hidden] { display: none; }
  .search .clr:hover { background: var(--raised); }
  .spacer { flex: 1; }
  .toolbar.is-overview .only-list { display: none; }
  .seg { display: inline-flex; height: 36px; padding: 4px; background: var(--raised); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { height: 28px; padding: 0 12px; border-radius: 4px; font-size: 13px; color: var(--sub); transition: background-color 140ms var(--ease), color 140ms var(--ease); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--raised-2); color: var(--ink); font-weight: 500; box-shadow: var(--shadow-s), inset 0 0 0 1px var(--line); }

  /* ───────── 표제란 (페이지 머리) ───────── */
  .pt { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); margin-bottom: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .pt-c { min-width: 0; padding: 16px 24px; }
  .pt-c + .pt-c { border-left: 1px solid var(--line); }
  .pt-l { font-size: 12px; line-height: 16px; color: var(--mute); }
  .pt-t h2 { margin-top: 8px; font-size: 28px; line-height: 32px; font-weight: 500; overflow-wrap: anywhere; }
  .pt-sub { margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--sub); }
  .pt-v { margin-top: 8px; font-family: var(--mono); font-size: 24px; line-height: 32px; font-weight: 500; white-space: nowrap; }
  .pt-v small { margin-left: 4px; font-family: var(--font); font-size: 13px; font-weight: 400; color: var(--mute); }
  .pt-bar { grid-column: 1 / -1; padding: 16px 24px 20px; border-top: 1px solid var(--line); }
  .dist-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-size: 13px; line-height: 20px; }
  .dist-h .l { color: var(--sub); }
  .dist-h .v { font-family: var(--mono); font-size: 12px; color: var(--mute); }
  .bar { display: flex; gap: 2px; height: 16px; margin-top: 12px; }
  .bar button { min-width: 4px; height: 16px; border-radius: 4px; background: var(--bar-a); transition: background-color 140ms var(--ease); }
  .bar button:nth-child(even) { background: var(--bar-b); }
  .bar button.lead, .bar button:hover { background: var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 12px; }
  .legend button { display: inline-flex; align-items: baseline; gap: 8px; font-size: 13px; line-height: 20px; color: var(--sub); border-radius: 4px; transition: color 140ms var(--ease); }
  .legend button:hover { color: var(--ink); }
  .legend .n { font-size: 12px; color: var(--mute); }
  .legend .lead .n { color: var(--accent); }
  .dist-none { margin-top: 8px; font-size: 13px; color: var(--mute); }

  /* ───────── 한눈에 보기 ───────── */
  .grp { margin-top: 40px; }
  .pt + .grp { margin-top: 32px; }
  .grp > h3 { margin-bottom: 12px; font-size: 13px; line-height: 16px; font-weight: 500; color: var(--sub); }
  .blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 16px; }
  .blk { min-width: 0; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .blk-h { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px; }
  .blk-h h4 { font-size: 14px; line-height: 20px; font-weight: 500; }
  .blk-h .n { font-size: 12px; color: var(--mute); }
  .blk-h .more { height: 28px; margin-left: auto; padding: 0 8px; border-radius: 4px; font-size: 12px; color: var(--sub); transition: background-color 140ms var(--ease), color 140ms var(--ease); }
  .blk-h .more:hover { background: var(--raised); color: var(--ink); }
  .blk .none { padding: 12px 8px 16px; font-size: 13px; color: var(--mute); }

  /* ───────── 기사 한 줄 ───────── */
  .row { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 12px 8px; border-radius: 8px; transition: background-color 140ms var(--ease); }
  .row:hover { background: var(--raised); }
  .d { font-size: 12px; line-height: 22px; color: var(--mute); }
  .d.is-today { color: var(--ink); }
  .t { font-size: 15px; line-height: 22px; font-weight: 500; text-decoration: none; word-break: keep-all; overflow-wrap: anywhere; transition: color 140ms var(--ease); }
  .t:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .row.read .t, .card.read .t { color: var(--mute); font-weight: 400; }
  .m { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; margin-top: 4px; }
  .mi { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--mute); }
  .mi + .mi::before { content: ""; width: 1px; height: 12px; background: var(--line-2); }
  .mi.pub { color: var(--sub); }
  .mi.warn { color: var(--warn); }
  .sum { margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .orig { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 목록 보기 (넓은 화면: 날짜 · 제목 · 출처를 세 열로 정렬) */
  .list { max-width: 1200px; }
  .gh { display: flex; align-items: baseline; gap: 8px; margin: 32px 0 4px; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
  .gh:first-child { margin-top: 0; }
  .gh .gl { font-size: 13px; line-height: 20px; font-weight: 500; }
  .gh.today .gl { color: var(--accent); }
  .gh .gn { font-family: var(--mono); font-size: 12px; color: var(--mute); }
  @media (min-width: 1200px) {
    .list .row { grid-template-columns: 48px minmax(0, 1fr) 208px; column-gap: 16px; }
    .list .row .b { display: contents; }
    .list .row .d { grid-column: 1; grid-row: 1; }
    .list .row .t { grid-column: 2; grid-row: 1; }
    .list .row .sum { grid-column: 2; grid-row: 2; }
    .list .row .orig { grid-column: 2; grid-row: 3; }

    });
  }
  /* 제목 앞뒤의 이모지는 화면에 내보내지 않음 (데이터는 그대로) */
  function clean(s) {
    return String(s == null ? '' : s).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F\u200D]/gu, '').replace(/\s{2,}/g, ' ').trim();
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : '#'; }
  function catOf(i) {
    var c = i.카테고리 || 'AI 트렌드';
    if (c === 'AI 트렌드') {
      var s = i.출처 || '';
      if (s === 'GitHub Trending') return 'GitHub 핫한 AI';
      if (s === 'HuggingFace Papers' || s === 'HuggingFace Spaces') return 'HuggingFace 논문·앱';
      if (s === 'AI 뉴스') return 'AI 활용·신기술 뉴스';
    }
    return c;
  }
  function isPinned(i) { return (i.인기도 || '') === '상시'; }
  function itemDate(i) { return DATE_RE.test(i.인기도 || '') ? i.인기도 : (i.수집일 || ''); }
  function byDateDesc(a, b) { return itemDate(b).localeCompare(itemDate(a)); }
  function dayMs(s) { return Date.parse(s + 'T00:00:00Z'); }
  function kstToday() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }
  function fmt(n, dec) { return Number(n).toLocaleString('ko-KR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
  function hasSummary(i) {
    var s = i.핵심요약 || '';
    return s && !/원문(\s*링크)?에서 상세 내용을 확인하세요\.$/.test(s);
  }

  /* 구글 RSS 링크는 기존 방식 그대로 검색 결과로 연결 */
  function target(i) {
    var link = i.링크 || '', url = safeUrl(link), hint = '';
    if (link.indexOf('news.google.com') !== -1) {
      if (!/[가-힣]/.test(i.원제목 || '')) {
        url = 'https://www.bing.com/search?q=' + encodeURIComponent(i.원제목 || i.한글제목 || '');
        hint = '현지 기사 검색으로 이동';
      } else {
        url = 'https://search.naver.com/search.naver?where=news&query=' + encodeURIComponent(i.한글제목 || i.원제목 || '');
        hint = '네이버 뉴스 검색으로 이동';
      }
    }
    return { url: url, hint: hint };
  }

  /* ───────── 읽음 표시 ───────── */
  var readSet = new Set();
  try { JSON.parse(localStorage.getItem('briefing-read') || '[]').forEach(function (k) { readSet.add(k); }); } catch (e) {}
  function markRead(url) {
    if (!url || url === '#') return;
    readSet.add(url);
    try { localStorage.setItem('briefing-read', JSON.stringify(Array.from(readSet).slice(-2000))); } catch (e) {}
  }

  /* ───────── 기사 한 줄/카드 ───────── */
  function metaHtml(i, opt) {
    var pub = i.구분 || i.출처 || catLabel(catOf(i));
    var h = '<span class="mi pub">' + esc(pub) + '</span>';
    if (opt.cat) h += '<span class="mi">' + esc(catLabel(catOf(i))) + '</span>';
    if (i.사건종류 && i.사건종류 !== 'AI자료' && i.사건종류 !== '공식바로가기') h += '<span class="mi">' + esc(i.사건종류) + '</span>';
    if (i.인기도 && !DATE_RE.test(i.인기도) && !isPinned(i)) h += '<span class="mi mono">' + esc(i.인기도) + '</span>';
    if (i.데이터상태) h += '<span class="mi warn" title="' + esc(i.데이터상태) + '">이전 데이터</span>';
    return '<div class="m">' + h + '</div>';
  }
  function linkHtml(i, t) {
    var title = clean(i.한글제목 || i.원제목) || '(제목 없음)';
    return '<a class="t" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer"' + (t.hint ? ' title="' + esc(t.hint) + '"' : '') + '>' + esc(title) + '</a>';
  }
  function rowHtml(i, opt) {
    var t = target(i), d = itemDate(i);
    var showOrig = opt.summary && i.원제목 && i.원제목 !== i.한글제목;
    return '<article class="row' + (readSet.has(t.url) ? ' read' : '') + '">' +
      '<time class="d' + (d === state.base ? ' is-today' : '') + '" datetime="' + esc(d) + '">' + esc(d.slice(5)) + '</time>' +
      '<div class="b">' + linkHtml(i, t) + metaHtml(i, opt) +
        (opt.summary && hasSummary(i) ? '<p class="sum">' + esc(i.핵심요약) + '</p>' : '') +
        (showOrig ? '<p class="orig" title="' + esc(i.원제목) + '">원제 ' + esc(i.원제목) + '</p>' : '') +
      '</div></article>';
  }
  function cardHtml(i, opt) {
    var t = target(i), d = itemDate(i);
    var showOrig = i.원제목 && i.원제목 !== i.한글제목;
    return '<article class="card' + (readSet.has(t.url) ? ' read' : '') + '">' +
      metaHtml(i, opt) + linkHtml(i, t) +
      (hasSummary(i) ? '<p class="sum">' + esc(i.핵심요약) + '</p>' : '') +
      (showOrig ? '<p class="orig" title="' + esc(i.원제목) + '">원제 ' + esc(i.원제목) + '</p>' : '') +
      '<div class="foot">' + esc(d) + '</div></article>';
  }

  /* ───────── 날짜 묶음 ───────── */
  function bucket(i) {
    var d = itemDate(i) || state.base;
    var diff = Math.floor((dayMs(state.base) - dayMs(d)) / 86400000);
    if (diff <= 0) return { key: 'today', label: '오늘 ' + d.slice(5) };
    if (diff === 1) return { key: 'yest', label: '어제 ' + d.slice(5) };
    if (diff <= 7) return { key: 'week', label: '최근 7일' };
    return { key: 'old', label: '8일 이전' };
  }

  /* ───────── 내비게이션 ───────── */
  function buildNav() {
    var counts = {}, fresh = {}, total = 0, totalFresh = 0;
    state.items.forEach(function (i) {
      if (isPinned(i)) return;
      var c = catOf(i);
      counts[c] = (counts[c] || 0) + 1; total++;
      if (bucket(i).key === 'today') { fresh[c] = (fresh[c] || 0) + 1; totalFresh++; }
    });
    var known = {};
    GROUPS.forEach(function (g) { g.cats.forEach(function (c) { known[c] = 1; }); });
    var extra = Object.keys(counts).filter(function (c) { return !known[c]; });
    state.groups = extra.length ? GROUPS.concat([{ name: '기타', cats: extra }]) : GROUPS;

    var h = '<button class="nav-all" data-cat="ALL"><span class="nm">전체 브리핑</span><span class="n">' +
      (totalFresh ? '<span class="nav-new">+' + fmt(totalFresh) + '</span>' : '') + fmt(total) + '</span></button>';
    state.groups.forEach(function (g) {
      h += '<div class="nav-g"><div class="nav-gt">' + esc(g.name) + '</div>';
      g.cats.forEach(function (c) {
        h += '<button class="nav-i" data-cat="' + esc(c) + '" title="' + esc(catLabel(c)) + '"><span class="nm">' + esc(catLabel(c)) + '</span>' +
          '<span class="n">' + (fresh[c] ? '<span class="nav-new">+' + fmt(fresh[c]) + '</span>' : '') + fmt(counts[c] || 0) + '</span></button>';
      });
      h += '</div>';
    });
    $('#nav').innerHTML = h;
    markNav();
  }
  function markNav() {
    document.querySelectorAll('#nav [data-cat]').forEach(function (b) {
      b.setAttribute('aria-current', String(b.dataset.cat === state.cat));
    });
  }

  /* ───────── 표제란 ───────── */
  function ptHtml(o) {
    var project = $('.brand h1').textContent;
    return '<section class="pt"><div class="pt-c pt-t"><div class="pt-l">' + esc(project) + '</div><h2>' + esc(o.title) + '</h2>' +
      (o.sub ? '<p class="pt-sub">' + esc(o.sub) + '</p>' : '') + '</div>' +
      o.cells.map(function (c) { return '<div class="pt-c"><div class="pt-l">' + esc(c.l) + '</div><div class="pt-v">' + c.v + '</div></div>'; }).join('') +
      (o.bar || '') + '</section>';
  }
  function cnt(n) { return fmt(n) + '<small>건</small>'; }
  function dateFig(d) { return d ? '<span class="y">' + esc(d.slice(0, 5)) + '</span>' + esc(d.slice(5)) : '-'; }

  /* 오늘 새 소식이 어느 카테고리에서 나왔는지: 한 줄 막대, 가장 많은 곳만 강조 */
  function distHtml(dated) {
    var by = {}, tot = 0;
    dated.forEach(function (i) {
      if (itemDate(i) !== state.base) return;
      var c = catOf(i); by[c] = (by[c] || 0) + 1; tot++;
    });
    if (!tot) return '<div class="pt-bar"><div class="dist-h"><span class="l">오늘 새 소식 분포</span></div><p class="dist-none">기준일에 새로 수집된 기사가 없습니다.</p></div>';
    var arr = Object.keys(by).map(function (c) { return { c: c, n: by[c] }; })
      .sort(function (a, b) { return b.n - a.n || a.c.localeCompare(b.c, 'ko'); });
    var bar = arr.map(function (x, k) {
      var label = catLabel(x.c) + ' ' + x.n + '건';
      return '<button class="' + (k === 0 ? 'lead' : '') + '" style="flex:' + x.n + ' 1 0" data-cat="' + esc(x.c) + '" aria-label="' + esc(label) + '" title="' + esc(label) + '"></button>';
    }).join('');
    var legend = arr.slice(0, 5).map(function (x, k) {
      return '<button class="' + (k === 0 ? 'lead' : '') + '" data-cat="' + esc(x.c) + '"><span>' + esc(catLabel(x.c)) + '</span><span class="n">' + fmt(x.n) + '</span></button>';
    }).join('');
    return '<div class="pt-bar"><div class="dist-h"><span class="l">오늘 새 소식 분포</span><span class="v">' + fmt(arr.length) + '개 카테고리</span></div>' +
      '<div class="bar">' + bar + '</div><div class="legend">' + legend + '</div></div>';
  }

  /* ───────── 화면 그리기 ───────── */
  function matchQ(i) {
    if (!state.q) return true;
    var text = [i.한글제목, i.핵심요약, i.원제목, i.출처, i.구분, i.카테고리].join(' ').toLowerCase();
    return text.indexOf(state.q.toLowerCase()) !== -1;
  }

  function overviewHtml() {
    var dated = state.items.filter(function (i) { return !isPinned(i); });
    var nNew = dated.filter(function (i) { return itemDate(i) === state.base; }).length;
    var h = ptHtml({
      title: '전체 브리핑',
      cells: [{ l: '기준일', v: dateFig(state.base) }, { l: '새 소식', v: cnt(nNew) }, { l: '전체', v: cnt(dated.length) }],
      bar: distHtml(dated)
    });
    state.groups.forEach(function (g) {
      h += '<section class="grp"><h3>' + esc(g.name) + '</h3><div class="blocks">';
      g.cats.forEach(function (c) {
        var list = dated.filter(function (i) { return catOf(i) === c; }).sort(byDateDesc);
        h += '<div class="blk"><div class="blk-h"><h4>' + esc(catLabel(c)) + '</h4><span class="n">' + fmt(list.length) + '</span>' +
          (list.length ? '<button class="more" data-cat="' + esc(c) + '">전체 보기</button>' : '') + '</div>';
        if (!list.length) h += '<p class="none">이번 브리핑에 수집된 기사가 없습니다.</p>';
        else h += list.slice(0, OVERVIEW_LIMIT).map(function (i) { return rowHtml(i, { summary: false }); }).join('');
        h += '</div>';
      });
      h += '</div></section>';
    });
    return h;
  }

  function listHtml() {
    var inCat = state.cat !== 'ALL';
    var scope = state.items.filter(function (i) { return (!inCat || catOf(i) === state.cat) && matchQ(i); });
    var pins = (inCat && !state.q) ? scope.filter(isPinned) : [];
    var news = scope.filter(function (i) { return pins.indexOf(i) === -1; });

    /* 언론사 드롭다운: 현재 범위의 언론사별 건수 */
    var pc = {};
    news.forEach(function (i) { var p = i.구분 || i.출처 || '기타'; pc[p] = (pc[p] || 0) + 1; });
    var pubs = Object.keys(pc).sort(function (a, b) { return pc[b] - pc[a] || a.localeCompare(b, 'ko'); });
    if (state.pub !== 'ALL' && !pc[state.pub]) state.pub = 'ALL';
    $('#pubSel').innerHTML = '<option value="ALL">언론사 전체 (' + fmt(news.length) + ')</option>' +
      pubs.map(function (p) { return '<option value="' + esc(p) + '"' + (p === state.pub ? ' selected' : '') + '>' + esc(p) + ' (' + fmt(pc[p]) + ')</option>'; }).join('');
    if (state.pub !== 'ALL') news = news.filter(function (i) { return (i.구분 || i.출처 || '기타') === state.pub; });
    news.sort(byDateDesc);

    var title = state.q && !inCat ? '“' + state.q + '” 검색 결과' : (state.q ? catLabel(state.cat) + ' 안에서 “' + state.q + '” 검색' : catLabel(state.cat));
    var nNew = news.filter(function (i) { return itemDate(i) === state.base; }).length;
    var h = ptHtml({
      title: title,
      sub: state.pub !== 'ALL' ? state.pub : '',
      cells: [{ l: '기준일', v: dateFig(state.base) }, { l: '새 소식', v: cnt(nNew) }, { l: '기사', v: cnt(news.length) }]
    });

    if (pins.length) {
      h += '<div class="pins">' + pins.map(function (i) {
        var t = target(i);
        return '<a class="pin" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer"><span class="icw">' + icon('pin') + '</span>' +
          '<span><b>' + esc(clean(i.한글제목 || i.원제목)) + '</b>' + (i.핵심요약 ? '<span class="s">' + esc(i.핵심요약) + '</span>' : '') + '</span></a>';
      }).join('') + '</div>';
    }

    if (!news.length) {
      return h + '<div class="state"><b>조건에 맞는 기사가 없습니다</b><p>검색어를 바꾸거나 언론사 선택을 해제해 보세요.</p>' +
        '<button class="ctl" data-act="reset">필터 초기화</button></div>';
    }

    var opt = { summary: true, cat: !inCat };
    if (state.view === 'card') {
      if (state.groupBy === 'pub') {
        var byPubCard = {};
        news.forEach(function (i) { var p = i.구분 || i.출처 || '기타'; (byPubCard[p] = byPubCard[p] || []).push(i); });
        var pubOrderCard = Object.keys(byPubCard).sort(function (a, b) { return byPubCard[b].length - byPubCard[a].length || a.localeCompare(b, 'ko'); });
        pubOrderCard.forEach(function (p) {
          h += '<div class="gh"><span class="gl">' + esc(p) + '</span><span class="gn">' + fmt(byPubCard[p].length) + '</span></div>';
          h += '<div class="cards">' + byPubCard[p].map(function (i) { return cardHtml(i, opt); }).join('') + '</div>';
        });
        return h;
      }
      return h + '<div class="cards">' + news.map(function (i) { return cardHtml(i, opt); }).join('') + '</div>';
    }
    if (state.groupBy === 'pub') {
      var byPub = {};
      news.forEach(function (i) { var p = i.구분 || i.출처 || '기타'; (byPub[p] = byPub[p] || []).push(i); });
      var pubOrder = Object.keys(byPub).sort(function (a, b) { return byPub[b].length - byPub[a].length || a.localeCompare(b, 'ko'); });
      h += '<div class="list">';
      pubOrder.forEach(function (p) {
        h += '<div class="gh"><span class="gl">' + esc(p) + '</span><span class="gn">' + fmt(byPub[p].length) + '</span></div>';
        byPub[p].forEach(function (i) { h += rowHtml(i, opt); });
      });
      return h + '</div>';
    }
    var counts = {};
    news.forEach(function (i) { var k = bucket(i).label; counts[k] = (counts[k] || 0) + 1; });
    var last = '';
    h += '<div class="list">';
    news.forEach(function (i) {
      var b = bucket(i), key = b.key + '|' + b.label;
      if (key !== last) {
        last = key;
        h += '<div class="gh ' + b.key + '"><span class="gl">' + esc(b.label) + '</span><span class="gn">' + fmt(counts[b.label]) + '</span></div>';
      }
      h += rowHtml(i, opt);
    });
    return h + '</div>';
  }

  function render() {
    if (state.loadError) {
      $('#content').innerHTML = '<div class="state"><b>데이터를 불러오지 못했습니다</b><p>' + esc(state.loadError) + '</p>' +
        '<button class="ctl" data-act="reload">다시 불러오기</button></div>';
      return;
    }
    var overview = state.cat === 'ALL' && !state.q;
    $('#toolbar').classList.toggle('is-overview', overview);
    $('#content').innerHTML = overview ? overviewHtml() : listHtml();
    $('#qClr').hidden = !state.q;
    $('#qKbd').hidden = !!state.q;
    document.querySelectorAll('#viewSeg [data-view]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.view === state.view)); });
    document.querySelectorAll('#groupSeg [data-group]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.group === state.groupBy)); });
    markNav();
  }

  function setCat(cat, noScroll) {
    state.cat = cat; state.pub = 'ALL';
    try { history.replaceState(null, '', cat === 'ALL' ? location.pathname + location.search : '#' + encodeURIComponent(cat)); } catch (e) {}
    render();
    if (!noScroll) window.scrollTo({ top: 0 });
  }

  /* ───────── 이벤트 ───────── */
  $('#nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]'); if (!b) return;
    state.q = ''; $('#q').value = '';
    setCat(b.dataset.cat);
    if (window.matchMedia('(max-width:900px)').matches) b.scrollIntoView({ inline: 'center', block: 'nearest' });
  });
  $('#content').addEventListener('click', function (e) {
    var go = e.target.closest('[data-cat]');
    if (go) { setCat(go.dataset.cat); return; }
    var act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'reset') { state.q = ''; state.pub = 'ALL'; $('#q').value = ''; render(); }
      if (act.dataset.act === 'reload') loadFeed($('#dateSel').value);
      return;
    }
    var a = e.target.closest('a.t');
    if (a) { markRead(a.getAttribute('href')); var box = a.closest('.row, .card'); if (box) box.classList.add('read'); }
  });
  var qTimer;
  $('#q').addEventListener('input', function (e) {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { state.q = e.target.value.trim(); state.pub = 'ALL'; render(); }, 120);
  });
  $('#qClr').addEventListener('click', function () { state.q = ''; $('#q').value = ''; render(); $('#q').focus(); });
  $('#pubSel').addEventListener('change', function (e) { state.pub = e.target.value; render(); });
  $('#viewSeg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]'); if (!b) return;
    state.view = b.dataset.view; render();
  });
  $('#groupSeg').addEventListener('click', function (e) {
    var b = e.target.closest('[data-group]'); if (!b) return;
    state.groupBy = b.dataset.group; render();
  });
  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') { e.preventDefault(); $('#q').focus(); }
    if (e.key === 'Escape') { closeWx(); if (document.activeElement === $('#q')) $('#q').blur(); }
  });

  /* 테마 */
  function applyThemeLabel() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    $('#themeBtn').innerHTML = '<span class="icw">' + icon(dark ? 'sun' : 'moon') + '</span><span class="lbl">' + (dark ? '라이트' : '다크') + '</span>';
  }
  $('#themeBtn').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('briefing-theme', next); } catch (e) {}
    applyThemeLabel();
  });
  applyThemeLabel();

  /* ───────── 데이터 불러오기 ───────── */
  function loadFeed(target) {
    var url = target === 'latest' ? './data/latest.json' : './data/' + encodeURIComponent(target) + '.json';
    state.loadError = '';
    fetch(url + '?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        state.items = Array.isArray(data.items) ? data.items : [];
        var u = String(data.updatedAt || '');
        state.base = DATE_RE.test(u.slice(0, 10)) ? u.slice(0, 10) : kstToday();
        $('#updatedAt').textContent = '업데이트 ' + (u || '-');
        state.pub = 'ALL';
        buildNav();
        var hashCat = decodeURIComponent((location.hash || '').slice(1));
        var valid = state.groups.some(function (g) { return g.cats.indexOf(hashCat) !== -1; });
        if (state.cat !== 'ALL' && !state.groups.some(function (g) { return g.cats.indexOf(state.cat) !== -1; })) state.cat = 'ALL';
        if (!state.initDone) { state.initDone = true; if (valid) state.cat = hashCat; }
        render();
        if (!state.entered) {
          state.entered = true;
          var c = $('#content'); c.classList.add('enter');
          c.addEventListener('animationend', function () { c.classList.remove('enter'); }, { once: true });
        }
      })
      .catch(function () {
        $('#updatedAt').textContent = '데이터 로드 실패';
        state.items = []; buildNav();
        state.loadError = location.protocol === 'file:'
          ? '파일을 직접 열면 데이터를 읽을 수 없습니다. GitHub Pages 주소나 로컬 서버(python -m http.server)로 열어 주세요.'
          : '선택한 날짜의 data 파일을 찾을 수 없습니다. 잠시 후 다시 시도하거나 다른 날짜를 선택해 주세요.';
        render();
      });
  }
  $('#dateSel').addEventListener('change', function (e) { loadFeed(e.target.value); });

  fetch('./data/dates.json?t=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (dates) {
      if (Array.isArray(dates) && dates.length) {
        $('#dateSel').innerHTML = '<option value="latest">최신 (' + esc(String(dates[0]).slice(5)) + ')</option>' +
          dates.map(function (d) { return '<option value="' + esc(d) + '">' + esc(d) + '</option>'; }).join('');
      }
    })
    .catch(function () {})
    .then(function () { loadFeed('latest'); });

  /* ───────── 날씨 (서울·청주·전주·광주·창원, Open-Meteo) ───────── */
  var WX_CITIES = [
    { id: 'seoul', name: '서울', lat: 37.5665, lon: 126.9780 },
    { id: 'cheongju', name: '청주', lat: 36.6424, lon: 127.4890 },
    { id: 'jeonju', name: '전주', lat: 35.8242, lon: 127.1480 },
    { id: 'gwangju', name: '광주', lat: 35.1595, lon: 126.8526 },
    { id: 'changwon', name: '창원', lat: 35.2279, lon: 128.6811 }
  ];
  var wxCache = {};
  var wxCityId = 'seoul';
  try {
    var savedCity = localStorage.getItem('briefing-city');
    if (WX_CITIES.some(function (c) { return c.id === savedCity; })) wxCityId = savedCity;
  } catch (e) {}

  function wIcon(c) {
    if (c === 0) return 'sun';
    if (c <= 2) return 'cloud-sun';
    if (c === 3) return 'cloud';
    if (c <= 48) return 'cloud-fog';
    if (c <= 67 || (c >= 80 && c <= 82)) return 'cloud-rain';
    if (c <= 77 || (c >= 85 && c <= 86)) return 'snowflake';
    return 'cloud-lightning';
  }
  function closeWx() { $('#wxPanel').hidden = true; $('#wxBtn').setAttribute('aria-expanded', 'false'); }
  $('#wxBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var p = $('#wxPanel'); p.hidden = !p.hidden;
    $('#wxBtn').setAttribute('aria-expanded', String(!p.hidden));
  });
  $('#wxPanel').addEventListener('click', function (e) {
    var btn = e.target.closest('.wx-c');
    if (!btn) return;
    e.stopPropagation();
    wxCityId = btn.dataset.city;
    try { localStorage.setItem('briefing-city', wxCityId); } catch (err) {}
    loadWeather(wxCityId);
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.wx')) closeWx(); });

  function renderWeather(city, d) {
    var names = ['일', '월', '화', '수', '목', '금', '토'];
    var rain0 = d.precipitation_probability_max ? d.precipitation_probability_max[0] : 0;
    $('#wxBtn').setAttribute('aria-label', city.name + ' 날씨 예보');
    $('#wxBtn').innerHTML = '<span class="icw">' + icon(wIcon(d.weather_code[0])) + '</span><span>' + city.name + ' ' + Math.round(d.temperature_2m_min[0]) + '° / ' + Math.round(d.temperature_2m_max[0]) + '°</span>' +
      (rain0 >= 30 ? '<span class="rain">' + rain0 + '%</span>' : '');
    $('#wxBtn').hidden = false;
    var cityTabs = '<div class="wx-cities">' + WX_CITIES.map(function (c) {
      return '<button class="wx-c" data-city="' + c.id + '" aria-pressed="' + String(c.id === city.id) + '">' + c.name + '</button>';
    }).join('') + '</div>';
    $('#wxPanel').innerHTML = cityTabs + '<div class="wx-h">' + city.name + ' 7일 예보</div>' + d.time.map(function (dt, k) {
      var rain = d.precipitation_probability_max ? d.precipitation_probability_max[k] : 0;
      var dn = k === 0 ? '오늘' : names[new Date(dt + 'T00:00:00+09:00').getDay()];
      return '<div class="wx-r' + (k === 0 ? ' today' : '') + '"><span class="dn">' + dn + '</span><span class="icw">' + icon(wIcon(d.weather_code[k])) + '</span>' +
        '<span class="tp">' + Math.round(d.temperature_2m_min[k]) + '° / ' + Math.round(d.temperature_2m_max[k]) + '°</span>' +
        '<span class="rn">' + (rain >= 20 ? '강수 ' + rain + '%' : '') + '</span></div>';
    }).join('');
  }

  function loadWeather(cityId) {
    var city = WX_CITIES.find(function (c) { return c.id === cityId; }) || WX_CITIES[0];
    if (wxCache[city.id]) { renderWeather(city, wxCache[city.id]); return; }
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + city.lat + '&longitude=' + city.lon + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul')
      .then(function (r) { return r.json(); })
      .then(function (w) {
        if (!w || !w.daily || !w.daily.time) return;
        wxCache[city.id] = w.daily;
        renderWeather(city, w.daily);
      })
      .catch(function () {});
  }
  loadWeather(wxCityId);

  /* ───────── 시장 지표 (선택 기능: 불러오지 못한 항목은 자동으로 숨김) ───────── */
  var fxCache = null;
  function getJson(url) { return fetch(url).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }

  function loadMarket() {
    var list = [], names = {};
    function add(x) { if (x && x.name && !names[x.name]) { names[x.name] = 1; list.push(x); } }
    getJson('./data/market.json?t=' + Date.now()).then(function (j) { (j.items || []).forEach(add); }).catch(function () {})
      .then(function () {
        return getJson('https://api.upbit.com/v1/ticker?markets=KRW-BTC,KRW-ETH').then(function (arr) {
          arr.forEach(function (c) {
            add({ name: c.market === 'KRW-BTC' ? '비트코인' : '이더리움', value: fmt(c.trade_price) + '원', change: c.signed_change_rate * 100 });
          });
        }).catch(function () {});
      })
      .then(function () {
        if (names['원/달러']) return;
        var p = fxCache ? Promise.resolve(fxCache) : getJson('https://open.er-api.com/v6/latest/USD').then(function (j) { fxCache = j; return j; });
        return p.then(function (j) { if (j && j.rates && j.rates.KRW) add({ name: '원/달러', value: fmt(j.rates.KRW, 1) + '원' }); }).catch(function () {});
      })
      .then(function () {
        if (!list.length) { $('#market').hidden = true; return; }
        $('#marketIn').innerHTML = list.map(function (x) {
          var c = '';
          if (typeof x.change === 'number' && isFinite(x.change)) {
            var up = x.change > 0, dn = x.change < 0;
            c = '<span class="mk-c ' + (up ? 'up' : dn ? 'down' : '') + '">' + (up ? '+' : '') + x.change.toFixed(2) + '%</span>';
          }
          return '<div class="mk"><span class="mk-n">' + esc(x.name) + '</span><span class="mk-v">' + esc(x.value) + '</span>' + c + '</div>';
        }).join('');
        $('#market').hidden = false;
      });
  }
  loadMarket();
  setInterval(function () { if (!document.hidden) loadMarket(); }, 60000);

  /* ───────── 방문자 카운터 (세션당 1회 집계: 오늘 / 누적) ───────── */
  (function () {
    var todayKey = 'visits-' + kstToday();
    var ns = 'kimjeonghun1-daily-briefing';
    var already = false;
    try { already = sessionStorage.getItem('briefing-counted') === todayKey; } catch (e) {}
    var mode = already ? 'get' : 'hit';
    Promise.all([
      getJson('https://abacus.jasoncameron.dev/' + mode + '/' + ns + '/' + todayKey).catch(function () { return null; }),
      getJson('https://abacus.jasoncameron.dev/' + mode + '/' + ns + '/visits').catch(function () { return null; })
    ]).then(function (res) {
      if (!already && (res[0] || res[1])) {
        try { sessionStorage.setItem('briefing-counted', todayKey); } catch (e) {}
      }
      var td = res[0] && typeof res[0].value === 'number' ? res[0].value : null;
      var tot = res[1] && typeof res[1].value === 'number' ? res[1].value : null;
      var parts = [];
      if (td !== null) parts.push('오늘 ' + fmt(td));
      if (tot !== null) parts.push('누적 ' + fmt(tot));
      if (parts.length) $('#visitStat').textContent = ' · 방문 ' + parts.join(' / ');
    });
  })();

  /* ───────── 휴가용 항공권·기차표 검색 ───────── */
  (function () {
    function addDays(n) {
      var d = new Date(Date.now() + 9 * 3600000 + n * 86400000);
      return d.toISOString().slice(0, 10);
    }
    var KOR_AIRPORT = {
      '서울': 'SEL', '인천': 'ICN', '김포': 'GMP', '제주': 'CJU', '부산': 'PUS', '김해': 'PUS',
      '대구': 'TAE', '청주': 'CJJ', '광주': 'KWJ', '여수': 'RSU', '울산': 'USN', '사천': 'HIN',
      '진주': 'HIN', '양양': 'YNY', '군산': 'KUV', '무안': 'MWX', '포항': 'KPO', '원주': 'WJU',
      '도쿄': 'TYO', '나리타': 'NRT', '하네다': 'HND', '오사카': 'KIX', '간사이': 'KIX',
      '후쿠오카': 'FUK', '삿포로': 'CTS', '오키나와': 'OKA', '나고야': 'NGO',
      '타이베이': 'TPE', '대만': 'TPE', '가오슝': 'KHH', '홍콩': 'HKG', '마카오': 'MFM',
      '다낭': 'DAD', '나트랑': 'CXR', '하노이': 'HAN', '호치민': 'SGN', '푸꾸옥': 'PQC',
      '방콕': 'BKK', '치앙마이': 'CNX', '푸켓': 'HKT', '싱가포르': 'SIN', '코타키나발루': 'BKI',
      '세부': 'CEB', '보홀': 'TAG', '마닐라': 'MNL', '발리': 'DPS', '괌': 'GUM', '사이판': 'SPN',
      '하와이': 'HNL', '호놀룰루': 'HNL', '시드니': 'SYD', '파리': 'CDG', '런던': 'LHR',
      '로마': 'FCO', '프라하': 'PRG', '뉴욕': 'JFK', '로스앤젤레스': 'LAX', '샌프란시스코': 'SFO'
    };
    function codeOf(v, fallback) {
      var raw = String(v || '').trim();
      var m = raw.toUpperCase().match(/[A-Z]{3}/);
      if (m) return m[0];
      var keys = Object.keys(KOR_AIRPORT);
      for (var i = 0; i < keys.length; i++) {
        if (raw.indexOf(keys[i]) !== -1) return KOR_AIRPORT[keys[i]];
      }
      return fallback;
    }
    $('#fDep').value = addDays(1);
    $('#fRet').value = addDays(4);

    function setVacOpen(open) {
      $('#vacBar').hidden = !open;
      $('#vacBtn').setAttribute('aria-pressed', String(open));
      $('#vacBtn').setAttribute('aria-expanded', String(open));
      if (open && window.scrollY > 120) window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    $('#vacBtn').addEventListener('click', function () { setVacOpen($('#vacBar').hidden); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#vacBar').hidden) setVacOpen(false); });

    $('#vacModeSeg').addEventListener('click', function (e) {
      var b = e.target.closest('[data-vac]'); if (!b) return;
      var mode = b.dataset.vac;
      document.querySelectorAll('#vacModeSeg [data-vac]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.vac === mode)); });
      $('#vacFlightForm').hidden = mode !== 'flight';
      $('#vacGroundForm').hidden = mode !== 'ground';
    });

    $('#fTrip').addEventListener('change', function (e) { $('#fRetWrap').hidden = e.target.value !== 'round'; });
    $('#fSwap').addEventListener('click', function () { var a = $('#fFrom').value; $('#fFrom').value = $('#fTo').value; $('#fTo').value = a; });

    function fParams() {
      var trip = $('#fTrip').value;
      var from = codeOf($('#fFrom').value, 'SEL');
      var to = codeOf($('#fTo').value, 'CJU');
      var dep = $('#fDep').value || addDays(1);
      var ret = $('#fRet').value || addDays(4);
      var pax = $('#fPax').value || '1';
      return { trip: trip, from: from, to: to, dep: dep, ret: ret, pax: pax };
    }
    var DOMESTIC_CODES = { SEL: 1, ICN: 1, GMP: 1, CJU: 1, PUS: 1, TAE: 1, CJJ: 1, KWJ: 1, RSU: 1, USN: 1, HIN: 1, YNY: 1, KUV: 1, MWX: 1 };

    $('#fGoSky').addEventListener('click', function () {
      var p = fParams();
      var d1 = p.dep.replace(/-/g, '').slice(2);
      var d2 = p.trip === 'round' ? '/' + p.ret.replace(/-/g, '').slice(2) : '';
      window.open('https://www.skyscanner.co.kr/transport/flights/' + p.from.toLowerCase() + '/' + p.to.toLowerCase() + '/' + d1 + d2 + '/?adults=' + p.pax, '_blank', 'noopener');
    });
    $('#fGoNaver').addEventListener('click', function () {
      var p = fParams();
      var dom = DOMESTIC_CODES[p.from] && DOMESTIC_CODES[p.to];
      var d1 = p.dep.replace(/-/g, ''), d2 = p.ret.replace(/-/g, '');
      var base = 'https://flight.naver.com/flights/' + (dom ? 'domestic' : 'international') + '/';
      var leg = p.from + '-' + p.to + '-' + d1 + (p.trip === 'round' ? '/' + p.to + '-' + p.from + '-' + d2 : '');
      window.open(base + leg + '?adult=' + p.pax + '&fareType=' + (dom ? 'YC' : 'Y'), '_blank', 'noopener');
    });
    $('#fGoGoogle').addEventListener('click', function () {
      var p = fParams();
      var q = 'Flights from ' + p.from + ' to ' + p.to + ' on ' + p.dep + (p.trip === 'round' ? ' through ' + p.ret : '');
      window.open('https://www.google.com/travel/flights?hl=ko&curr=KRW&q=' + encodeURIComponent(q), '_blank', 'noopener');
    });
  })();

  /* ───────── 문의사항 모달 & 메일 발송 ───────── */
  (function () {
    var modal = document.createElement('div');
    modal.className = 'req-backdrop';
    modal.id = 'reqModal';
    modal.hidden = true;
    modal.innerHTML =
      '<div class="req-modal" role="dialog" aria-modal="true" aria-labelledby="reqTitle">' +
        '<div class="req-hd"><h2 id="reqTitle">문의사항 보내기</h2><button type="button" class="ctl" id="reqClose" style="width:32px;height:32px;padding:0;justify-content:center" aria-label="닫기">' + icon('x') + '</button></div>' +
        '<form id="reqForm">' +
          '<div class="req-bd">' +
            '<div class="req-to"><span>수신: 구조부 김정훈 과장 (<span class="mono">jaykim@samboeng.co.kr</span>)</span><button type="button" class="req-copy" id="reqCopy">주소 복사</button></div>' +
            '<div class="vac-field"><label for="reqSender">작성자 / 소속 (선택)</label><input class="vac-input" id="reqSender" type="text" placeholder="예: 홍길동 / 구조부" /></div>' +
            '<div class="vac-field"><label for="reqType">분류</label><select class="vac-input" id="reqType"><option value="정보/탭 추가 요청">정보/탭 추가 요청</option><option value="오류·기사 제외 요청">오류·기사 제외 요청</option><option value="기타 문의">기타 문의</option></select></div>' +
            '<div class="vac-field"><label for="reqMsg">문의 내용</label><textarea id="reqMsg" required placeholder="추가하고 싶은 탭, 키워드, 언론사 또는 수정 요청 사항을 입력해 주세요."></textarea></div>' +
            '<div class="req-status" id="reqStatus"></div>' +
          '</div>' +
          '<div class="req-ft">' +
            '<a class="ctl" id="reqMailto" href="mailto:jaykim@samboeng.co.kr?subject=%5B%EA%B5%AC%EC%A1%B0%EB%B6%80%20%EB%8D%B0%EC%9D%BC%EB%A6%AC%20%EB%B8%8C%EB%A6%AC%ED%95%91%5D%20%EB%AC%B8%EC%9D%98%EC%82%AC%ED%95%AD">메일 앱으로 열기</a>' +
            '<button type="submit" class="ctl vac-go" id="reqSend">메일로 보내기</button>' +
          '</div>' +
        '</form>' +
      '</div>';
    document.body.appendChild(modal);

    function closeReq() { modal.hidden = true; }
    $('#reqBtn').addEventListener('click', function () {
      $('#reqStatus').textContent = '';
      $('#reqStatus').className = 'req-status';
      modal.hidden = false;
      $('#reqMsg').focus();
    });
    $('#reqClose').addEventListener('click', closeReq);
    modal.addEventListener('click', function (e) { if (e.target === modal) closeReq(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeReq(); });

    $('#reqCopy').addEventListener('click', function () {
      var btn = this;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText('jaykim@samboeng.co.kr').then(function () {
          btn.textContent = '복사됨'; setTimeout(function () { btn.textContent = '주소 복사'; }, 1500);
        });
      }
    });

    $('#reqForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = $('#reqMsg').value.trim();
      if (!msg) return;
      var sender = ($('#reqSender').value || '익명').trim();
      var kind = $('#reqType').value;
      var status = $('#reqStatus');
      var sendBtn = $('#reqSend');
      sendBtn.disabled = true;
      sendBtn.textContent = '전송 중...';
      status.className = 'req-status';
      status.textContent = '메일을 전송하고 있습니다...';

      fetch('https://formsubmit.co/ajax/jaykim@samboeng.co.kr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: '[구조부 데일리 브리핑] ' + kind + ' (' + sender + ')',
          작성자: sender,
          분류: kind,
          내용: msg,
          _template: 'table'
        })
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function () {
        status.className = 'req-status ok';
        status.textContent = '전송되었습니다. 감사합니다!';
        $('#reqMsg').value = '';
        setTimeout(closeReq, 1400);
      }).catch(function () {
        status.className = 'req-status err';
        status.textContent = '자동 전송에 실패했습니다. 아래 "메일 앱으로 열기" 또는 주소 복사를 이용해 주세요.';
      }).finally(function () {
        sendBtn.disabled = false;
        sendBtn.textContent = '메일로 보내기';
      });
    });
  })();
})();
</script>
</body>
</html>
