<!DOCTYPE html>

<html lang="ko">
<head>

<title>국내 엔지니어링 발주 브리핑</title>
<script>
  /* 첫 화면 깜빡임 방지: 저장된 테마 또는 시스템 설정을 먼저 적용 */
  (function () {
    var t = null;
    try { t = localStorage.getItem('briefing-theme') || localStorage.getItem('procurement-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root {
    --hh: 60px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Pretendard Variable", Pretendard, monospace;
    --bg: #fafafa; --panel: #ffffff; --raised: #f4f4f5; --raised-2: #ffffff;
    --ink: #171717; --sub: #525252; --mute: #6e6e6e; --ink-rgb: 23 23 23;
    --line: rgb(var(--ink-rgb) / 0.08); --line-2: rgb(var(--ink-rgb) / 0.14);
    --accent: #1f5f9e; --warn: #a15c07;
  }
  [data-theme="dark"] {
    --bg: #141415; --panel: #19191b; --raised: #232325; --raised-2: #2c2c2f;
    --ink: #ededed; --sub: #a1a1a6; --mute: #85858b; --ink-rgb: 237 237 237;
    --accent: #7db4ea; --warn: #e2ad5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: light; scroll-padding-top: 100px; }
  html[data-theme="dark"] { color-scheme: dark; }
  body { font-family: var(--font); font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .icw { display: inline-flex; color: var(--mute); }
  .n, .mono { font-family: var(--mono); }

  .top-in { max-width: 1440px; height: 100%; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }

  .brand h1 { font-size: 16px; line-height: 20px; font-weight: 500; }

  .tools { display: flex; align-items: center; gap: 8px; }

  .ctl:hover { background: var(--raised); }

  select.ctl { padding-right: 8px; cursor: pointer; }
  .shell { max-width: 1440px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; }
  .side { position: sticky; top: var(--hh); align-self: start; max-height: calc(100vh - var(--hh)); overflow-y: auto; padding: 24px 0 32px; scrollbar-width: thin; }
  .nav-i { width: 100%; height: 36px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; font-size: 14px; line-height: 20px; text-align: left; color: var(--sub); transition: background-color 140ms var(--ease), color 140ms var(--ease); }
  .nav-i + .nav-i { margin-top: 2px; }
  .nav-i .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-i .n { font-family: var(--mono); font-size: 12px; color: var(--mute); text-align: right; }
  .nav-i:hover { background: var(--raised); color: var(--ink); }
  .nav-i[aria-current="true"] { background: var(--raised); color: var(--ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); }
  .nav-gt { margin-bottom: 8px; padding: 0 12px; font-size: 12px; line-height: 16px; color: var(--mute); }
  main { min-width: 0; padding: 24px 0 64px; }
  .search { position: relative; flex: 1 1 240px; max-width: 400px; }

  .search input::placeholder { color: var(--mute); }
  .search input:focus { border-color: var(--accent); }
  .search .icw { position: absolute; left: 12px; top: 10px; pointer-events: none; }
  .spacer { flex: 1; }
  .pt { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); margin-bottom: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .pt-c { min-width: 0; padding: 16px 24px; }
  .pt-c + .pt-c { border-left: 1px solid var(--line); }
  .pt-l { font-size: 12px; line-height: 16px; color: var(--mute); }
  .pt-t h2 { margin-top: 8px; font-size: 28px; line-height: 32px; font-weight: 500; overflow-wrap: anywhere; }
  .pt-sub { margin-top: 4px; font-size: 13px; line-height: 20px; color: var(--sub); }

    .top-in { padding-left: 16px; padding-right: 16px; }

    .nav-gt { display: none; }

    .nav-i + .nav-i { margin-top: 0; }
    main { padding: 16px 16px 48px; }
    .pt { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pt-t { grid-column: 1 / -1; border-bottom: 1px solid var(--line); }
    .pt-t + .pt-c { border-left: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* 발주현황: 중립 회색·얇은 선·숫자 중심 목록 */
  .bid-detail[hidden] { display: none !important; }

  .bid-filters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0 12px; }

  .bid-note { font-size: 12px; line-height: 18px; color: var(--mute); }
  .bid-message { margin: 0 0 16px; padding: 12px 16px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; font-size: 13px; line-height: 20px; color: var(--sub); }
  .bid-message strong { color: var(--ink); font-weight: 500; }
  .bid-message ul { margin-left: 16px; }

  .bid-demo { border-left: 3px solid var(--accent); }
  .bid-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: -12px 0 20px; font-size: 12px; color: var(--mute); }
  .bid-summary .pt-v { font-size: 21px; }
  .bid-summary .pt-v small { font-size: 11px; }
  .bid-budget-count { font-size: 12px; margin-top: 4px; color: var(--mute); }
  .bid-results-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: center; margin: 20px 0 10px; }
  .bid-results-top h3 { font-size: 14px; font-weight: 500; }
  .bid-table-wrap { overflow-x: auto; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
  .bid-table { border-collapse: collapse; width: 100%; min-width: 800px; text-align: left; table-layout: fixed; }
  .bid-table th { padding: 10px 8px; background: var(--raised); color: var(--sub); font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--line-2); }
  .bid-table td { padding: 14px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; line-height: 20px; overflow-wrap: anywhere; }
  .bid-table tr:last-child td { border-bottom: 0; }
  .bid-table .bid-row:hover td { background: var(--raised); }
  .bid-table .bid-row.is-cancelled .bid-title { color: var(--mute); text-decoration: line-through; }
  .bid-table .bid-title { font-size: 14px; line-height: 21px; font-weight: 500; }
  .bid-table a { color: var(--ink); text-decoration: none; }
  .bid-table a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .bid-cell-sub { font-size: 11px; color: var(--mute); line-height: 17px; margin-top: 4px; }
  .bid-tags { display: flex; flex-wrap: wrap; gap: 4px 8px; color: var(--sub); font-size: 11px; margin-top: 5px; }
  .bid-date { font-family: var(--mono); font-size: 11px; line-height: 18px; white-space: nowrap; }
  .bid-deadline-extra { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
  .bid-deadline-extra .bid-cell-sub { color: var(--warn); font-size: 10px; line-height: 15px; margin: 0 0 2px; }
  .bid-money { text-align: right; font-family: var(--mono); font-size: 12px; line-height: 18px; }
  .bid-money-label { font-family: var(--font); font-size: 11px; line-height: 17px; color: var(--mute); margin-top: 4px; }
  .bid-status { font-size: 12px; white-space: normal; word-break: keep-all; color: var(--sub); }
  .bid-status.is-open { color: var(--accent); }
  .bid-status.is-cancelled, .bid-status.is-unknown { color: var(--warn); }
  .bid-text-btn { padding: 4px 0; color: var(--sub); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .bid-text-btn:hover { color: var(--accent); }
  .bid-star { width: 28px; height: 28px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--mute); }
  .bid-star:hover { background: var(--raised-2); }
  .bid-star[aria-pressed="true"] { color: var(--accent); }
  .bid-star[aria-pressed="true"] svg { fill: currentColor; }
  .bid-detail td { background: var(--panel); padding: 16px 20px 20px; }
  .bid-detail dl { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 16px; font-size: 12px; line-height: 19px; }
  .bid-detail dt { color: var(--mute); }
  .bid-detail dd { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bid-detail a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .bid-links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .bid-pagination { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin: 16px 0; }
  .bid-page-buttons { display: flex; gap: 8px; align-items: center; }
  .bid-pagination .mono { font-size: 12px; color: var(--mute); }
  .ctl:disabled { opacity: .45; cursor: default; transform: none; }
  .bid-coverage { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--sub); }
  .bid-coverage summary { cursor: pointer; color: var(--ink); font-weight: 500; }
  .bid-coverage ul { margin: 12px 0 0 18px; }
  .bid-coverage li { margin-bottom: 6px; line-height: 19px; }
  .bid-coverage .bid-note { margin-top: 12px; }
  #bidToast { min-height: 18px; margin-top: 8px; font-size: 12px; color: var(--sub); }
  @media (max-width: 1100px) { .bid-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) {
    .bid-toolbar .search { flex-basis: 100%; }
    .bid-toolbar .ctl { padding-left: 9px; padding-right: 9px; font-size: 12px; }
    .bid-filters { gap: 10px 8px; }
    .bid-summary .pt-v { font-size: 17px; }
    .bid-summary .pt-c { padding-left: 12px; padding-right: 10px; }
    .bid-summary .pt-l { font-size: 11px; }
    .bid-meta { display: grid; }
  }
  /* ───────── 최상단 큰 탭 전환 바 (데일리 브리핑 ↔ 발주 브리핑) ───────── */
  .hub-bar { background: var(--panel); border-bottom: 1px solid var(--line-2); }
  .hub-in { max-width: 1440px; margin: 0 auto; padding: 0 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hub-tab {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 52px; padding: 0 16px; text-decoration: none; color: var(--mute);
    font-size: 15px; font-weight: 500; border-bottom: 3px solid transparent;
    transition: color 140ms var(--ease), background-color 140ms var(--ease), border-color 140ms var(--ease);
  }
  .hub-tab:hover { color: var(--ink); background: var(--raised); }
  .hub-tab[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); background: var(--bg); }
  .hub-tab .hub-sub { font-size: 12px; font-weight: 400; color: var(--mute); }
  @media (max-width: 900px) { .hub-in { padding: 0 16px; } }
  @media (max-width: 520px) {
    .hub-in { padding: 0 8px; gap: 4px; }
    .hub-tab { height: 46px; font-size: 13px; padding: 0 8px; }
    .hub-tab .hub-sub { display: none; }
  }
</style>
</head>
<body>
<nav class="hub-bar" aria-label="브리핑 화면 전환">
  <div class="hub-in">
    <a class="hub-tab" href="./index.html"><span>구조부 데일리 브리핑</span><span class="hub-sub">뉴스 · 시장 · 날씨</span></a>
    <a class="hub-tab" href="./procurement.html" aria-current="page"><span>국내 엔지니어링 발주</span><span class="hub-sub">나라장터 용역 발주현황</span></a>
  </div>
</nav>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>국내 엔지니어링 발주 브리핑</h1><p id="updatedAt">자료 불러오는 중</p></div>
    <div class="tools"><a class="ctl" href="https://www.g2b.go.kr/" target="_blank" rel="noopener noreferrer" title="나라장터 공식 사이트">나라장터 ↗</a><button class="ctl" id="themeBtn" type="button" aria-label="화면 모드 전환" title="화면 모드 전환"></button></div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="발주기관 구분"></nav>
  <main>
    <section id="procurementView" aria-label="국내 엔지니어링 발주현황">
      <div class="bid-toolbar">
        <div class="search"><span class="icw"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><input type="search" id="bidSearch" placeholder="발주명 · 기관 · 공고번호 검색" aria-label="발주현황 검색" autocomplete="off" /></div>
        <button class="ctl" id="bidRefresh" type="button">새로고침</button>

      <div id="bidContent" aria-live="polite"><div class="skel"></div><div class="skel"></div></div>
      <div id="bidToast" role="status"></div>
    </section>
  </main>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var STAGES = { plan: '발주계획', prespec: '사전규격', notice: '입찰공고', award: '낙찰결과', contract: '계약' };
  var GROUPS = { local: '지자체', public: '공공기관·중앙기관', unclassified: '분류대기' };
  var STATUS = { ok: '수집 완료', partial: '일부 수집', error: '수집 오류', not_configured: '수집 전' };
  var COVERAGE = { ok: '수집 완료', error: '오류', not_configured: '연결 전', unsupported: '미지원', disabled: '미사용' };
  var PAGE_SIZE = 50;
  var favorites = new Set();
  try {
    var savedFavorites = JSON.parse(localStorage.getItem('procurement-favorites') || '[]');
    if (Array.isArray(savedFavorites)) savedFavorites.forEach(function (x) { if (typeof x === 'string') favorites.add(x); });
  } catch (e) {}
  var state = {
    data: null, production: null, mode: 'production', loading: false, error: '',
    scope: 'all', query: '', field: 'all', work: 'all', stage: 'all', region: 'all', status: 'all',
    favoritesOnly: false, reviewOnly: false, sort: 'deadline', page: 1, expanded: new Set(), request: 0
  };

  function text(v) { return v == null ? '' : String(v); }
  function esc(v) { return text(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(value) {
    try { var u = new URL(text(value)); return u.protocol === 'https:' || u.protocol === 'http:' ? u.href : ''; } catch (e) { return ''; }
  }
  function number(n) { return typeof n === 'number' && Number.isFinite(n) && n >= 0 ? n : null; }
  function fmt(n) { return n.toLocaleString('ko-KR', { maximumFractionDigits: 2 }); }
  function formatWon(n) { return number(n) === null ? '미제공' : fmt(n) + '원'; }
  function compactWon(n) {
    if (number(n) === null) return '—';
    if (n >= 1000000000000) return fmt(n / 1000000000000) + '<small>조 원</small>';
    if (n >= 100000000) return fmt(n / 100000000) + '<small>억 원</small>';
    if (n >= 10000) return fmt(n / 10000) + '<small>만 원</small>';
    return fmt(n) + '<small>원</small>';
  }
  function parseKstDate(value) {
    if (typeof value !== 'string' || !value.trim()) return null;
    var s = value.trim();
