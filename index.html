<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리팀만 보는 데일리 브리핑</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-hover: #1a2338;
      --border: #232e47;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem 4rem;
    }
    .container { max-width: 1160px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 0.25rem; }
    .updated {
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .header-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }
    .date-select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.38rem 0.75rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }
    .date-select:focus { border-color: var(--accent); }
    .weather-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      margin-top: 0.85rem;
    }
    .weather-day {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.35rem 0.6rem;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text);
    }
    .weather-day.today {
      border-color: rgba(56, 189, 248, 0.45);
      background: var(--accent-soft);
    }
    .w-date { color: var(--muted); font-weight: 600; }
    .w-temp { font-variant-numeric: tabular-nums; }
    .w-rain { color: #60a5fa; font-size: 0.72rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .filter-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      font-size: 0.86rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
      font-weight: 650;
    }
    .count-pill {
      font-size: 0.75rem;
      opacity: 0.75;
      margin-left: 0.25rem;
    }
    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      min-width: 220px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .view-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .view-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 0.48rem 0.7rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .view-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .news-list {
      display: flex;
      flex-direction: column;
    }
    .news-row {
      padding: 0.95rem 0.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      transition: background 0.12s ease;
    }
    .news-row:hover {
      background: rgba(255, 255, 255, 0.025);
    }
    .news-row-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.55rem;
    }
    .news-row-title {
      color: #f1f5f9;
      text-decoration: none;
      font-size: 1.03rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .news-row-title:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .news-row-meta {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .news-row-meta .sep { margin: 0 0.35rem; opacity: 0.45; }
    .news-row-summary {
      margin-top: 0.3rem;
      font-size: 0.85rem;
      color: #9ca3af;
      line-height: 1.45;
    }
    .date-group-header {
      margin-top: 1.35rem;
      margin-bottom: 0.35rem;
      padding: 0.45rem 0.75rem;
      font-size: 0.84rem;
      font-weight: 700;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid var(--border);
      color: var(--muted);
    }
    .date-group-header:first-child { margin-top: 0.25rem; }
    .date-group-header.today { border-left-color: #34d399; color: #6ee7b7; background: rgba(52, 211, 153, 0.08); }
    .date-group-header.week { border-left-color: #38bdf8; color: #7dd3fc; background: rgba(56, 189, 248, 0.08); }
    .date-group-header.pinned { border-left-color: #fbbf24; color: #fde68a; background: rgba(251, 191, 36, 0.08); }
    .new-pill {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.1rem 0.4rem;
      border-radius: 5px;
      background: rgba(52, 211, 153, 0.2);
      color: #6ee7b7;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .news-row.older .news-row-title { color: #cbd5e1; font-weight: 500; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: #334155;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
    }
    .badge {
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.12);
      color: #cbd5e1;
    }
    .badge.sambo { background: rgba(14, 165, 233, 0.18); color: #38bdf8; }
    .badge.ai { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; }
    .badge.civil { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
    .badge.bid { background: rgba(251, 191, 36, 0.16); color: #fde68a; }
    .badge.global { background: rgba(52, 211, 153, 0.16); color: #6ee7b7; }
    .badge.sea { background: rgba(45, 212, 191, 0.16); color: #5eead4; }
    .badge.vn { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
    .badge.krpol { background: rgba(96, 165, 250, 0.16); color: #93c5fd; }
    .badge.glpol { background: rgba(129, 140, 248, 0.16); color: #a5b4fc; }
    .badge.kreco { background: rgba(244, 114, 182, 0.16); color: #f9a8d4; }
    .badge.gleco { background: rgba(251, 146, 60, 0.16); color: #fdba74; }
    .pop { color: var(--muted); font-variant-numeric: tabular-nums; }
    .title { font-size: 1.04rem; font-weight: 650; color: #f8fafc; line-height: 1.45; }
    .summary { font-size: 0.9rem; color: #cbd5e1; }
    .orig { font-size: 0.78rem; color: var(--muted); word-break: break-word; }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.82rem;
    }
    .lang-tag { color: var(--muted); }
    .link-btn {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .link-btn:hover { text-decoration: underline; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      background: var(--card);
      border-radius: 14px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1><span>우리팀만 보는</span> 데일리 브리핑</h1>
        <p class="subtitle">AI 트렌드 · 기술사-토목구조 · 국내입찰 · 해외토목(동남아/베트남) · 국내외 정치/경제</p>
        <div class="weather-strip" id="weatherStrip"></div>
      </div>
      <div class="header-right">
        <select class="date-select" id="dateSelect" title="날짜별 아카이브 선택">
          <option value="latest">최신 브리핑</option>
        </select>
        <div class="updated" id="updatedAt">불러오는 중...</div>
      </div>
    </header>

    <div class="controls">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-cat="ALL">전체</button>
        <button class="filter-btn" data-cat="삼보기술단">🏢 삼보기술단</button>
        <button class="filter-btn" data-cat="AI 트렌드">🤖 AI 트렌드</button>
        <button class="filter-btn" data-cat="기술사-토목구조">📐 기술사-토목구조</button>
        <button class="filter-btn" data-cat="국내 입찰·용역">📋 국내 입찰·용역</button>
        <button class="filter-btn" data-cat="해외 토목사업">🌍 해외 토목사업</button>
        <button class="filter-btn" data-cat="해외토목-동남아">🌏 해외토목-동남아</button>
        <button class="filter-btn" data-cat="해외토목-베트남">🇻🇳 해외토목-베트남</button>
        <button class="filter-btn" data-cat="국내정치">🏛️ 국내정치</button>
        <button class="filter-btn" data-cat="해외정치">🌐 해외정치</button>
        <button class="filter-btn" data-cat="국내경제">📈 국내경제</button>
        <button class="filter-btn" data-cat="해외경제">💹 해외경제</button>
      </div>
      <div class="search-wrap">
        <input type="search" class="search-box" id="searchInput" placeholder="키워드 검색 (예: 교량, 입찰, 에이전트...)" />
        <div class="view-toggle">
          <button class="view-btn active" data-view="list">리스트</button>
          <button class="view-btn" data-view="card">카드</button>
        </div>
      </div>
    </div>

    <div class="news-list" id="grid"></div>
  </div>

  <script>
    let allItems = [];
    let currentCat = 'ALL';
    let currentView = 'list';

    function getCategory(item) {
      return item.카테고리 || 'AI 트렌드';
    }

    function getBadgeClass(cat) {
      if (cat === '삼보기술단') return 'sambo';
      if (cat === 'AI 트렌드') return 'ai';
      if (cat === '기술사-토목구조' || cat === '토목·구조') return 'civil';
      if (cat === '국내 입찰·용역') return 'bid';
      if (cat === '해외 토목사업') return 'global';
      if (cat === '해외토목-동남아') return 'sea';
      if (cat === '해외토목-베트남') return 'vn';
      if (cat === '국내정치') return 'krpol';
      if (cat === '해외정치') return 'glpol';
      if (cat === '국내경제') return 'kreco';
      return 'gleco';
    }

    function updateCounts() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const cat = btn.dataset.cat;
        const base = btn.textContent.replace(/\s*\(\d+\)$/, '');
        const count = cat === 'ALL' ? allItems.length : allItems.filter(i => getCategory(i) === cat).length;
        btn.innerHTML = `${base} <span class="count-pill">(${count})</span>`;
      });
    }

    function render() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allItems.filter(item => {
        const cat = getCategory(item);
        const matchCat = currentCat === 'ALL' || cat === currentCat;
        const text = `${item.한글제목} ${item.핵심요약} ${item.원제목} ${item.출처} ${item.구분}`.toLowerCase();
        const matchQuery = !q || text.includes(q);
        return matchCat && matchQuery;
      }).sort((a, b) => {
        const pa = a.인기도 || '';
        const pb = b.인기도 || '';
        if (pa === '상시' && pb !== '상시') return -1;
        if (pb === '상시' && pa !== '상시') return 1;
        const da = /^\d{4}-\d{2}-\d{2}$/.test(pa) ? pa : (a.수집일 || '');
        const db = /^\d{4}-\d{2}-\d{2}$/.test(pb) ? pb : (b.수집일 || '');
        return db.localeCompare(da);
      });

      const grid = document.getElementById('grid');
      grid.className = currentView === 'list' ? 'news-list' : 'grid';
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">표시할 항목이 없습니다.</div>';
        return;
      }

      const baseDateStr = new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
      const baseMs = new Date(baseDateStr + 'T00:00:00Z').getTime();

      function getDateGroup(item) {
        if ((item.인기도 || '') === '상시') return { key: 'pinned', label: '📌 고정 안내' };
        const dStr = /^\d{4}-\d{2}-\d{2}$/.test(item.인기도 || '') ? item.인기도 : (item.수집일 || baseDateStr);
        const diffDays = Math.floor((baseMs - new Date(dStr + 'T00:00:00Z').getTime()) / 86400000);
        if (diffDays <= 0) return { key: 'today', label: `🟢 오늘 (${dStr})` };
        if (diffDays <= 7) return { key: 'week', label: '🔵 최근 7일' };
        return { key: 'older', label: '⚪ 지난 소식 (8일 이상)' };
      }

      let lastGroupKey = '';
      grid.innerHTML = filtered.map(item => {
        const cat = getCategory(item);
        const grp = getDateGroup(item);
        let groupHeaderHtml = '';
        if (currentView === 'list' && grp.key !== lastGroupKey) {
          lastGroupKey = grp.key;
          groupHeaderHtml = `<div class="date-group-header ${grp.key}">${grp.label}</div>`;
        }

        const isGoogleRss = (item.링크 || '').includes('news.google.com');
        let targetUrl = item.링크;
        let linkLabel = '원문 보기 →';
        if (isGoogleRss && !/[가-힣]/.test(item.원제목 || '')) {
          targetUrl = `https://www.bing.com/search?q=${encodeURIComponent(item.원제목 || item.한글제목)}`;
          linkLabel = '현지 기사 검색 →';
        } else if (isGoogleRss) {
          targetUrl = `https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(item.한글제목 || item.원제목)}`;
          linkLabel = '네이버에서 기사 보기 →';
        }

        if (currentView === 'list') {
          const pub = item.구분 || item.출처 || cat;
          const dateOrPop = item.인기도 || item.수집일 || '';
          const showSummary = item.핵심요약 && !item.핵심요약.endsWith('원문에서 상세 내용을 확인하세요.') && !item.핵심요약.endsWith('원문 링크에서 상세 내용을 확인하세요.');
          const todayBadge = grp.key === 'today' ? '<span class="new-pill">오늘</span>' : '';
          return `${groupHeaderHtml}
            <div class="news-row ${grp.key}">
              <div class="news-row-head">
                <a class="news-row-title" href="${targetUrl}" target="_blank" rel="noopener noreferrer">${todayBadge}${item.한글제목 || item.원제목}</a>
                <span class="news-row-meta">${pub}<span class="sep">|</span>${dateOrPop}<span class="sep">|</span>${cat}</span>
              </div>
              ${showSummary ? `<div class="news-row-summary">${item.핵심요약}</div>` : ''}
            </div>
          `;
        }

        return `
          <article class="card">
            <div>
              <div class="card-top">
                <span class="badge ${getBadgeClass(cat)}">${item.출처 || cat}</span>
                <span class="pop">${item.인기도 || ''}</span>
              </div>
              <h2 class="title" style="margin-top:0.65rem;">${item.한글제목 || item.원제목}</h2>
              <p class="summary" style="margin-top:0.5rem;">${item.핵심요약 || ''}</p>
              ${item.원제목 && item.원제목 !== item.한글제목 ? `<p class="orig" style="margin-top:0.45rem;">원제: ${item.원제목}</p>` : ''}
            </div>
            <div class="card-footer">
              <span class="lang-tag">${cat} · ${item.구분 || ''}</span>
              <a class="link-btn" href="${targetUrl}" target="_blank" rel="noopener noreferrer">${linkLabel}</a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('filters').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      render();
    });

    document.getElementById('searchInput').addEventListener('input', render);

    document.querySelector('.view-toggle').addEventListener('click', e => {
      const btn = e.target.closest('.view-btn');
      if (!btn) return;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      render();
    });

    function loadFeed(target) {
      const url = target === 'latest' ? './data/latest.json' : `./data/${target}.json`;
      fetch(`${url}?t=${Date.now()}`)
        .then(r => r.json())
        .then(data => {
          document.getElementById('updatedAt').textContent = `업데이트: ${data.updatedAt || '-'}`;
          allItems = data.items || [];
          updateCounts();
          render();
        })
        .catch(() => {
          document.getElementById('updatedAt').textContent = '데이터 로드 실패';
          document.getElementById('grid').innerHTML = '<div class="empty">해당 날짜의 데이터를 불러올 수 없습니다.</div>';
        });
    }

    document.getElementById('dateSelect').addEventListener('change', e => {
      loadFeed(e.target.value);
    });

    fetch('./data/dates.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : [])
      .then(dates => {
        const sel = document.getElementById('dateSelect');
        if (Array.isArray(dates) && dates.length > 0) {
          sel.innerHTML = `<option value="latest">최신 (${dates[0]})</option>` +
            dates.map(d => `<option value="${d}">${d}</option>`).join('');
        }
      })
      .catch(() => {})
      .finally(() => loadFeed('latest'));

    function weatherIcon(code) {
      if (code === 0) return '☀️';
      if (code <= 3) return '⛅';
      if (code <= 48) return '🌫️';
      if (code <= 67 || (code >= 80 && code <= 82)) return '🌧️';
      if (code <= 77 || (code >= 85 && code <= 86)) return '❄️';
      return '⛈️';
    }

    fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul')
      .then(r => r.json())
      .then(w => {
        const d = w.daily;
        if (!d || !d.time) return;
        const days = ['일','월','화','수','목','금','토'];
        document.getElementById('weatherStrip').innerHTML = d.time.map((dt, idx) => {
          const dayName = idx === 0 ? '오늘' : days[new Date(dt + 'T00:00:00+09:00').getDay()];
          const minT = Math.round(d.temperature_2m_min[idx]);
          const maxT = Math.round(d.temperature_2m_max[idx]);
          const rain = d.precipitation_probability_max ? d.precipitation_probability_max[idx] : 0;
          return `<div class="weather-day ${idx === 0 ? 'today' : ''}" title="${dt} 서울 예보">
            <span class="w-date">${dayName}</span>
            <span>${weatherIcon(d.weather_code[idx])}</span>
            <span class="w-temp">${minT}°/${maxT}°</span>
            ${rain >= 20 ? `<span class="w-rain">💧${rain}%</span>` : ''}
          </div>`;
        }).join('');
      })
      .catch(() => {});
  </script>
</body>
</html>
