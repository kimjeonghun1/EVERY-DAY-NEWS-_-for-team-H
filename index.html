<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team H 데일리 브리핑 | AI · 토목구조 · 입찰 · 해외 · 경제</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131a2a;
      --card-hover: #1a2338;
      --border: #232e47;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem 4rem;
    }
    .container { max-width: 1160px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-top: 0.25rem; }
    .updated {
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .filter-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      font-size: 0.86rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
      font-weight: 650;
    }
    .count-pill {
      font-size: 0.75rem;
      opacity: 0.75;
      margin-left: 0.25rem;
    }
    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      min-width: 240px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: #334155;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
    }
    .badge {
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.12);
      color: #cbd5e1;
    }
    .badge.ai { background: rgba(168, 85, 247, 0.16); color: #d8b4fe; }
    .badge.civil { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
    .badge.bid { background: rgba(251, 191, 36, 0.16); color: #fde68a; }
    .badge.global { background: rgba(52, 211, 153, 0.16); color: #6ee7b7; }
    .badge.krpol { background: rgba(96, 165, 250, 0.16); color: #93c5fd; }
    .badge.glpol { background: rgba(129, 140, 248, 0.16); color: #a5b4fc; }
    .badge.kreco { background: rgba(244, 114, 182, 0.16); color: #f9a8d4; }
    .badge.gleco { background: rgba(251, 146, 60, 0.16); color: #fdba74; }
    .pop { color: var(--muted); font-variant-numeric: tabular-nums; }
    .title { font-size: 1.04rem; font-weight: 650; color: #f8fafc; line-height: 1.45; }
    .summary { font-size: 0.9rem; color: #cbd5e1; }
    .orig { font-size: 0.78rem; color: var(--muted); word-break: break-word; }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.82rem;
    }
    .lang-tag { color: var(--muted); }
    .link-btn {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .link-btn:hover { text-decoration: underline; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      background: var(--card);
      border-radius: 14px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1><span>Team H</span> 데일리 브리핑</h1>
        <p class="subtitle">AI 트렌드 · 토목구조(기술사) · 입찰/용역 · 해외토목 · 국내외 정치/경제</p>
      </div>
      <div class="updated" id="updatedAt">불러오는 중...</div>
    </header>

    <div class="controls">
      <div class="filters" id="filters">
        <button class="filter-btn active" data-cat="ALL">전체</button>
        <button class="filter-btn" data-cat="AI 트렌드">🤖 AI 트렌드</button>
        <button class="filter-btn" data-cat="토목·구조">🏗️ 토목·구조</button>
        <button class="filter-btn" data-cat="국내 입찰·용역">📋 국내 입찰·용역</button>
        <button class="filter-btn" data-cat="해외 토목사업">🌍 해외 토목사업</button>
        <button class="filter-btn" data-cat="국내정치">🏛️ 국내정치</button>
        <button class="filter-btn" data-cat="해외정치">🌐 해외정치</button>
        <button class="filter-btn" data-cat="국내경제">📈 국내경제</button>
        <button class="filter-btn" data-cat="해외경제">💹 해외경제</button>
      </div>
      <input type="search" class="search-box" id="searchInput" placeholder="키워드 검색 (예: 교량, 입찰, 에이전트...)" />
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    let allItems = [];
    let currentCat = 'ALL';

    function getCategory(item) {
      return item.카테고리 || 'AI 트렌드';
    }

    function getBadgeClass(cat) {
      if (cat === 'AI 트렌드') return 'ai';
      if (cat === '토목·구조') return 'civil';
      if (cat === '국내 입찰·용역') return 'bid';
      if (cat === '해외 토목사업') return 'global';
      if (cat === '국내정치') return 'krpol';
      if (cat === '해외정치') return 'glpol';
      if (cat === '국내경제') return 'kreco';
      return 'gleco';
    }

    function updateCounts() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const cat = btn.dataset.cat;
        const base = btn.textContent.replace(/\s*\(\d+\)$/, '');
        const count = cat === 'ALL' ? allItems.length : allItems.filter(i => getCategory(i) === cat).length;
        btn.innerHTML = `${base} <span class="count-pill">(${count})</span>`;
      });
    }

    function render() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = allItems.filter(item => {
        const cat = getCategory(item);
        const matchCat = currentCat === 'ALL' || cat === currentCat;
        const text = `${item.한글제목} ${item.핵심요약} ${item.원제목} ${item.출처} ${item.구분}`.toLowerCase();
        const matchQuery = !q || text.includes(q);
        return matchCat && matchQuery;
      });

      const grid = document.getElementById('grid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">표시할 항목이 없습니다.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const cat = getCategory(item);
        return `
          <article class="card">
            <div>
              <div class="card-top">
                <span class="badge ${getBadgeClass(cat)}">${item.출처 || cat}</span>
                <span class="pop">${item.인기도 || ''}</span>
              </div>
              <h2 class="title" style="margin-top:0.65rem;">${item.한글제목 || item.원제목}</h2>
              <p class="summary" style="margin-top:0.5rem;">${item.핵심요약 || ''}</p>
              ${item.원제목 && item.원제목 !== item.한글제목 ? `<p class="orig" style="margin-top:0.45rem;">원제: ${item.원제목}</p>` : ''}
            </div>
            <div class="card-footer">
              <span class="lang-tag">${cat} · ${item.구분 || ''}</span>
              <a class="link-btn" href="${item.링크}" target="_blank" rel="noopener noreferrer">원문 보기 →</a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('filters').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      render();
    });

    document.getElementById('searchInput').addEventListener('input', render);

    fetch('./data/latest.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        document.getElementById('updatedAt').textContent = `업데이트: ${data.updatedAt || '-'}`;
        allItems = data.items || [];
        updateCounts();
        render();
      })
      .catch(() => {
        document.getElementById('updatedAt').textContent = '데이터 로드 실패';
        document.getElementById('grid').innerHTML = '<div class="empty">data/latest.json 파일을 불러올 수 없습니다.</div>';
      });
  </script>
</body>
</html>
